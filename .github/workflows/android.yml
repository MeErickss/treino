name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web (export estático)
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk treino.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: treino-apk
          path: treino.apk

      - name: Publicar no Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Treino — última versão
          body: |
            APK do app Treino. Baixe **treino.apk** abaixo e instale no Android.
            (Ative "instalar apps de fontes desconhecidas" quando pedir.)
          files: treino.apk
